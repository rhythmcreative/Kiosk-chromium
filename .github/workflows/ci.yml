name: CI (lint + test)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r haoskiosk/tests/requirements-test.txt

      - name: Run pytest
        run: pytest -v haoskiosk/tests

      # pre-commit config runs mdformat, beautysh, codespell, shellcheck and the
      # pre-commit-hooks safety checks. mdformat & beautysh are *reformatters* - in CI there's
      # no way to commit their output, so they'd fail the run on any file they rewrite. They're
      # meant to be run locally (and committed) by the maintainer; CI skips them and enforces
      # everything that only *checks*. Run locally before pushing:
      #   pre-commit run --all-files
      - name: Pre-commit hooks (skip reformatters)
        env:
          SKIP: mdformat,beautysh
        uses: pre-commit/action@v3.0.1
