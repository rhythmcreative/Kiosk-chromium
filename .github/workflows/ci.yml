name: CI (lint + test)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r haoskiosk/tests/requirements-test.txt

      - name: Run pytest
        run: pytest -v haoskiosk/tests

      # pre-commit config runs mdformat, prettier-style hooks, beautysh, codespell and
      # shellcheck -- catches formatting/style/shell errors that pytest wouldn't.
      - name: Pre-commit hooks
        uses: pre-commit/action@v3.0.1
