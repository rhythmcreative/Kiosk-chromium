name: Build & publish add-on images

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'haoskiosk/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'haoskiosk/**'

# Reference: https://github.com/home-assistant/actions/tree/master/builder
env:
  BUILD_TARGET: haoskiosk  # must match the add-on slug

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validate the add-on actually builds (and the config.yaml is valid) on every PR.
      # Only amd64 is tested on PRs to keep them fast; all arches build on push.
      - name: Build add-on (PR validation, amd64 only)
        if: github.event_name == 'pull_request'
        uses: home-assistant/builder@2024.01
        with:
          args: |
            --amd64 \
            --test \
            --target ${{ env.BUILD_TARGET }} \
            --image "ghcr.io/${{ github.repository_owner }}/{arch}-${{ env.BUILD_TARGET }}"

      # On push to main: build + push prebuilt images for every arch in config.yaml
      # (aarch64/amd64/armv7) so users don't have to compile locally on install.
      - name: Build & push add-on (all arches)
        if: github.event_name == 'push'
        uses: home-assistant/builder@2024.01
        with:
          args: |
            --all \
            --target ${{ env.BUILD_TARGET }} \
            --image "ghcr.io/${{ github.repository_owner }}/{arch}-${{ env.BUILD_TARGET }}"
